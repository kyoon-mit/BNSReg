# lightning.pytorch==2.6.0
# S4D GaussNLL regression: chirp_mass on bns_snr_10_20 dataset
# Window: 59–63 s (4 s pre-merger), 256 Hz → L=1024
# Architecture: d_model=512, d_state=32, n_layers=4

seed_everything: 20260502

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: checks_s4d_gaussnll_snr_8_20
      id: chirp_mass_ft_snr_5_50_59-63s_d64_s64_l4
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_var0mse_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/sigma_0
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_var0sigma_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        patience: 200
        mode: min
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: BNSReg.callbacks.within_pct_accuracy.WithinPctAccuracyCallback

    - class_path: BNSReg.callbacks.plot_param_est.PlotParamEstCallback
      init_args:
        save_dir: ""

  fast_dev_run: false
  max_epochs: 3000
  min_epochs: 100
  max_steps: -1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
  accumulate_grad_batches: 1

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.parameter_estimation.model_s4d_gaussnll.LitModelS4DGaussianNLLLoss
  init_args:
    model_cfg:
      d_input: 2
      d_output: 4
      d_model: 64
      d_state: 64
      n_layers: 4
      dropout: 0.3
      input_norm: false
      lr: 1e-3
      dt_min: 0.001
      dt_max: 5
    beta_nll: 0.3
    lambda_spread: 0.7
    base_lr: 5e-5
    warmup_epochs: 5
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-7
    warmup_start_factor: 1.0e-2
    reset_optimizer: true

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.regression_loader.LitBNSDataRegression
  init_args:
    data_cfg:
      target_variables: ['chirp_mass', 'mass_ratio']
      observed_variables: ['snr']
      normalize_variables: true
      normalize_range: [0.0, 1.0]

      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/checks/bns_snr_8_20_uniform_4096Hz_100K_5s/train/sig_combined_train.h5
      val_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/checks/bns_snr_8_20_uniform_4096Hz_100K_5s/val/sig_combined_val.h5
      test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/checks/bns_snr_8_20_uniform_4096Hz_100K_5s/test/sig_combined_test.h5

      injected_data_key: whitened_injected

      strain_frequency: 4096
      downsample_factor: 16
      strain_duration: 5
      coalescence_time: 4
      window_begin: 0
      window_end: 4

      strain_precision: torch.float32
      variables_precision: torch.float32

      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      train_batch_size: 128
      val_batch_size: 128
      test_batch_size: 128
      num_workers: 4
      shuffle: true
      prefetch_factor: 4
      persistent_workers: true

ckpt_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs/checks_s4d_gaussnll_snr_8_20/chirp_mass_ft_59-63s_d64_s64_l4/checkpoints/s4d_gaussnll_var0mse_ckpt_epoch=954.ckpt
weights_only: false
