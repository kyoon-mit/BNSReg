# lightning.pytorch==2.6.0

seed_everything: 20260502

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: checks_s4d_gaussnll_snr_8_20
      id: chirp_mass_ckpt_51-55s_d512_s32_l4
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_var0mse_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/sigma_0
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_var0sigma_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        patience: 100
        mode: min
        verbose: true

    - class_path: BNSReg.callbacks.reset_early_stopping.ResetEarlyStoppingCallback
      init_args:
        patience: 100

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: BNSReg.callbacks.within_pct_accuracy.WithinPctAccuracyCallback

    - class_path: BNSReg.callbacks.plot_param_est.PlotParamEstCallback
      init_args:
        save_dir: ""

  fast_dev_run: false
  max_epochs: 5000
  min_epochs: 300
  max_steps: -1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
  accumulate_grad_batches: 1

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.parameter_estimation.model_s4d_gaussnll.LitModelS4DGaussianNLLLoss
  init_args:
    model_cfg:
      d_input: 2
      d_output: 4
      d_model: 512
      d_state: 32
      n_layers: 4
      dropout: 0.2
      input_norm: true
      lr: 1e-3
      dt_min: 1e-5
      dt_max: 5
    beta_nll: 0.3
    lambda_spread: 0.3
    base_lr: 5e-5
    warmup_epochs: 5
    T_0: 30
    T_mult: 1
    eta_min: 1.0e-7
    warmup_start_factor: 1.0e-2
    reset_optimizer: true

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.regression_loader.LitBNSDataRegression
  init_args:
    data_cfg:
      target_variables: ['chirp_mass', 'mass_ratio']
      observed_variables: ['snr']
      normalize_variables: true
      normalize_range: [0.0, 1.0]

      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_uniform_powerlaw_256Hz_100K/train/sig_combined_train.h5
      val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_uniform_powerlaw_256Hz_100K/val/sig_combined_val.h5 
      test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_uniform_powerlaw_256Hz_100K/test/sig_combined_test.h5

      injected_data_key: whitened_injected

      strain_frequency: 256
      downsample_factor: 1
      strain_duration: 64
      coalescence_time: 63
      window_begin: 51
      window_end: 55

      strain_precision: torch.float32
      variables_precision: torch.float32

      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      train_batch_size: 1024
      val_batch_size: 1024
      test_batch_size: 1024
      num_workers: 4
      shuffle: true
      prefetch_factor: 4
      persistent_workers: true

ckpt_path: null
weights_only: null