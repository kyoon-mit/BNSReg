# lightning.pytorch==2.6.0
# LinOSS GaussNLL regression: chirp_mass on bns_snr_10_20 dataset
# Signal-only (whitened_signal): validates whether chirp_mass is learnable
# before switching to noisy whitened_injected.
# Window: 59–63 s (4 s pre-merger), 128 Hz (downsample 2×) → L=512
# Architecture: d_model=512, ssm_size=32, n_layers=4

seed_everything: 20260425

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 16-mixed

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: ai4gw@cern__linoss_gaussnll_snr_10_20
      id: chirp_mass_59-63s_linoss_d512_p32_l4_sigonly
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 'linoss_gaussnll_sigonly_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 3
        save_on_train_epoch_end: true
        filename: 'linoss_gaussnll_sigonly_var0mse_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        patience: 50
        mode: min
        min_delta: 1.0e-5
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: BNSReg.callbacks.within_pct_accuracy.WithinPctAccuracyCallback

    - class_path: BNSReg.callbacks.efficiency.EfficiencyCallback

    - class_path: BNSReg.callbacks.wandb_csv_export.WandBCSVExportCallback

    - class_path: BNSReg.callbacks.plot_param_est.PlotParamEstCallback
      init_args:
        save_dir: ""

  fast_dev_run: false
  max_epochs: 3000
  min_epochs: 60
  max_steps: -1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
  accumulate_grad_batches: 1
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.parameter_estimation.model_linoss_gaussnll.LitModelLinOSSGaussianNLLLoss
  init_args:
    model_cfg:
      d_input: 2
      d_output: 2
      d_model: 512
      ssm_size: 32
      n_layers: 4
      dropout: 0.2
      discretization: IM
    beta_nll: 0.3
    lambda_spread: 0.3
    base_lr: 1.0e-4
    weight_decay: 1.0e-2
    warmup_epochs: 10
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-7
    warmup_start_factor: 1.0e-2

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.regression_loader.LitBNSDataRegression
  init_args:
    data_cfg:
      # ===== Variables =====
      target_variables: ['chirp_mass']
      observed_variables: ['snr']
      normalize_variables: true
      normalize_range: [-1.0, 1.0]

      # ===== Files =====
      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_10_20_uniform_powerlaw_256Hz_50K/train/sig_combined_train.h5
      test_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_10_20_uniform_powerlaw_256Hz_50K/test/sig_combined_test.h5
      val_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_10_20_uniform_powerlaw_256Hz_50K/val/sig_combined_val.h5

      injected_data_key: whitened_signal

      # ===== Signal properties =====
      strain_frequency: 256
      downsample_factor: 2
      strain_duration: 64
      coalescence_time: 63

      window_begin: 59
      window_end: 63

      # ===== Precision =====
      strain_precision: torch.float32
      variables_precision: torch.float32

      # ===== HDF5 caching =====
      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      # ===== Batching =====
      train_batch_size: 128
      val_batch_size: 128
      test_batch_size: 128

      num_workers: 4
      shuffle: true
      prefetch_factor: 2
      persistent_workers: true

# =========================
# Checkpoint
# =========================
ckpt_path: null
weights_only: null
