# lightning.pytorch==2.6.0

seed_everything: 20260408

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: ai4gw@cern__s4d_gaussnll_snr_5_50
      id: chirp_mass_0-4s_d64_s16_l8
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 3
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_var0mseloss_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        patience: 100
        mode: min
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: BNSReg.callbacks.within_pct_accuracy.WithinPctAccuracyCallback

    - class_path: BNSReg.callbacks.plot_param_est.PlotParamEstCallback
      init_args:
        save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs/ai4gw@cern__s4d_gaussnll_snr_5_50/chirp_mass_0-4s_d64_s16_l8/plots

  # ===== Training control =====
  fast_dev_run: false
  max_epochs: 3000
  min_epochs: 100
  max_steps: -1
  min_steps: null
  max_time: null

  # ===== Batch limits =====
  limit_train_batches: null     # float | int | null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null

  overfit_batches: 0.0          # float
  val_check_interval: null      # float | int | null
  check_val_every_n_epoch: 1    # int
  num_sanity_val_steps: null    # int | null
  log_every_n_steps: 10         # int | null

  # ===== System =====
  enable_checkpointing: null    # bool | null
  enable_progress_bar: true     # bool
  enable_model_summary: null    # bool | null

  accumulate_grad_batches: 1    # int
  gradient_clip_val: null       # float | null
  gradient_clip_algorithm: null # str | null

  deterministic: null           # bool | null
  benchmark: null               # bool | null
  inference_mode: true          # bool
  use_distributed_sampler: true # bool

  profiler: null                # str | null
  detect_anomaly: false         # bool
  barebones: false              # bool
  plugins: null                 # str | list | null
  sync_batchnorm: false         # bool
  reload_dataloaders_every_n_epochs: 0  # int
  default_root_dir: null        # path | null
  enable_autolog_hparams: true  # bool
  model_registry: null          # str | null

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.parameter_estimation.model_s4d_gaussnll.LitModelS4DGaussianNLLLoss
  init_args:
    model_cfg:
      d_input: 2
      d_output: 2
      d_model: 64
      d_state: 16
      n_layers: 8
      dropout: 0.3
    beta_nll: 0.5
    base_lr: 5.0e-5
    warmup_epochs: 60
    T_0: 32
    T_mult: 2
    eta_min: 5.0e-7
    warmup_start_factor: 1.0e-2

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.regression_loader.LitBNSDataRegression
  init_args:
    data_cfg:
      # ===== Variables =====
      target_variables: ['chirp_mass']
      observed_variables: ['snr']

      # ===== Normalization pre-processing =====
      normalize_variables: true
      normalize_range: [0.0, 1.0]

      # ===== Files =====
      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_100K/train/sig_combined_train.h5
      test_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_100K/test/sig_combined_test.h5
      val_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_100K/val/sig_combined_val.h5

      injected_data_key: whitened_injected
      sig_only_data_key: whitened_signal
      bkg_only_data_key: whitened_bkg

      # ===== Signal properties =====
      strain_frequency: 256
      downsample_factor: 1
      strain_duration: 64
      coalescence_time: 63

      window_begin: 0
      window_end: 4

      # ===== Precision =====
      strain_precision: torch.float32
      variables_precision: torch.float32

      # ===== HDF5 caching =====
      rdcc_nbytes: 67108864   # int
      rdcc_nslots: 10007      # int
      rdcc_w0: 0.75           # float

      # ===== Batching =====
      train_batch_size: 2048  # int (required)
      val_batch_size: 2048    # int (required)
      test_batch_size: 2048   # int (required)

      num_workers: 4          # int
      shuffle: true           # bool
      prefetch_factor: 2      # int
      persistent_workers: true # bool

# =========================
# Optimizer
# =========================
ckpt_path: null     # path | null
weights_only: null  # bool | null