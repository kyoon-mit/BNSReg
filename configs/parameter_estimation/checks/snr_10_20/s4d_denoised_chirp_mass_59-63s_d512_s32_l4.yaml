# lightning.pytorch==2.6.0
# Denoised regression: frozen S4D contrastive denoiser prepended to S4D GaussNLL regressor
# Window: 59–63 s (4 s pre-merger, 256 Hz → L=1024)
# denoiser_ckpt / denoiser_cfg: filled in by run.sh after denoiser converges

seed_everything: 20260425

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: ai4gw@cern__s4d_gaussnll_snr_10_20
      id: denoised_chirp_mass_59-63s_d512_s32_l4
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_denoised_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_gaussnll_denoised_var0mse_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        patience: 50
        mode: min
        min_delta: 1e-5
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: BNSReg.callbacks.within_pct_accuracy.WithinPctAccuracyCallback

    - class_path: BNSReg.callbacks.plot_param_est.PlotParamEstCallback
      init_args:
        save_dir: ""

  fast_dev_run: false
  max_epochs: 3000
  min_epochs: 60
  max_steps: -1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
  accumulate_grad_batches: 1

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.seq_denoise.denoised_regression_s4d_gaussnll.LitModelDenoisedS4DGaussianNLLLoss
  init_args:
    model_cfg:
      d_input: 2
      d_output: 2       # mean + var for chirp_mass
      d_model: 512
      d_state: 32
      n_layers: 4
      dropout: 0.2
      dt_min: 0.001e-3
      dt_max: 1
      denoiser_ckpt: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs/ai4gw@cern__s4d_contrastive_snr_10_20/seq_denoise_59-63s_d256_s64_l4/checkpoints/s4d_contrastive_mse_ckpt_epoch=80.ckpt
      denoiser_cfg:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/configs/seq_denoise/ai4gw@cern/s4d_contrastive_snr_10_20/seq_denoise_59-63s_d256_s64_l4.yaml

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.regression_loader.LitBNSDataRegression
  init_args:
    data_cfg:
      target_variables: ['chirp_mass']
      observed_variables: ['snr']
      normalize_variables: true
      normalize_range: [0.0, 1.0]

      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_10_20_uniform_powerlaw_256Hz_50K/train/sig_combined_train.h5
      val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_10_20_uniform_powerlaw_256Hz_50K/val/sig_combined_val.h5
      test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_10_20_uniform_powerlaw_256Hz_50K/test/sig_combined_test.h5

      injected_data_key: whitened_injected

      strain_frequency: 256
      downsample_factor: 1
      strain_duration: 64
      coalescence_time: 63
      window_begin: 59
      window_end: 63

      strain_precision: torch.float32
      variables_precision: torch.float32

      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      train_batch_size: 32
      val_batch_size: 32
      test_batch_size: 32
      num_workers: 4
      shuffle: true
      prefetch_factor: 4
      persistent_workers: true

# Optimizer embedded in model_cfg (LitModelDenoisedS4DGaussianNLLLoss uses LitDenoiserBaseTask)
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 5.0e-4

lr_scheduler:
  class_path: BNSReg.utils.schedulers.WarmupCosineAnnealingWarmRestarts
  init_args:
    warmup_epochs: 10
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-7
    warmup_start_factor: 1.0e-2

ckpt_path: null
weights_only: null
