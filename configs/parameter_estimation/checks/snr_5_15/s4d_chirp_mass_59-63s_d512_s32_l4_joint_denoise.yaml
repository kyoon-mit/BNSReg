# lightning.pytorch==2.6.0
# Joint Denoising + Regression (S4D): chirp_mass on bns_snr_5_15 dataset
# Window: 59–63 s (4 s pre-merger), 256 Hz → L=1024
# Architecture: d_model=512, d_state=32, n_layers=4
# Loss: MSE (signal reconstruction) + staged GaussNLL (chirp_mass regression)

seed_everything: 20260428

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: ai4gw@cern__s4d_gaussnll_snr_5_15
      id: chirp_mass_59-63s_d512_s32_l4_joint_denoise
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_joint_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss_reg
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 's4d_joint_gaussnll_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 60
        mode: min
        min_delta: 1e-6
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

  fast_dev_run: false
  max_epochs: 3000
  min_epochs: 80
  max_steps: -1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
  accumulate_grad_batches: 1

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.seq_denoise.s4d_joint_denoise_reg.LitModelS4DJointDenoiseReg
  init_args:
    cfg:
      d_input: 2
      d_output: 2
      d_model: 512
      d_state: 32
      n_layers: 4
      dropout: 0.2
      input_norm: false
      lr: 5.0e-4
      dt_min: 0.1
      dt_max: 2
    n_vars: 1
    warmup_epochs: 20
    max_reg_weight: 1.0
    reg_ramp_epochs: 30
    base_lr: 1.0e-5
    weight_decay: 1.0e-2
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-7
    warmup_start_factor: 1.0e-2

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.joint_denoise_loader.LitBNSDataJointDenoise
  init_args:
    data_cfg:
      target_variables: ['chirp_mass']
      observed_variables: ['snr']
      normalize_variables: false

      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_15_uniform_256Hz_50K/train/sig_combined_train.h5
      val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_15_uniform_256Hz_50K/val/sig_combined_val.h5
      test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_15_uniform_256Hz_50K/test/sig_combined_test.h5

      injected_data_key: whitened_injected
      sig_only_data_key: whitened_signal

      strain_frequency: 256
      downsample_factor: 1
      strain_duration: 64
      coalescence_time: 63
      window_begin: 59
      window_end: 63

      strain_precision: torch.float32
      variables_precision: torch.float32

      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      train_batch_size: 128
      val_batch_size: 128
      test_batch_size: 128
      num_workers: 4
      shuffle: true
      prefetch_factor: 2
      persistent_workers: true

ckpt_path: null
weights_only: null
