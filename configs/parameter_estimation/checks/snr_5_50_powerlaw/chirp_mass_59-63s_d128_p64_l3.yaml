# lightning.pytorch==2.6.0
# LinOSS GaussNLL regression: chirp_mass on bns_snr_5_50_powerlaw dataset
# Window: 59–63 s (4 s pre-merger), 256 Hz → L=1024
# Architecture: d_model=128, ssm_size=64, n_layers=3, IMEX
# LR adapted from reference: peak 2e-5, warmup 5 epochs, cosine restarts

seed_everything: 20260429

trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: ai4gw@cern__linoss_gaussnll_snr_5_50_powerlaw
      id: chirp_mass_59-63s_d128_p64_l3
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 'linoss_gaussnll_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 2
        save_on_train_epoch_end: true
        filename: 'linoss_gaussnll_var0mse_ckpt_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        patience: 60
        mode: min
        min_delta: 1.0e-6
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: BNSReg.callbacks.within_pct_accuracy.WithinPctAccuracyCallback

    - class_path: BNSReg.callbacks.plot_param_est.PlotParamEstCallback
      init_args:
        save_dir: ""

  fast_dev_run: false
  max_epochs: 3000
  min_epochs: 80
  max_steps: -1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
  accumulate_grad_batches: 1

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.parameter_estimation.model_linoss_gaussnll.LitModelLinOSSGaussianNLLLoss
  init_args:
    model_cfg:
      d_input: 2
      d_output: 2       # mean + var for chirp_mass
      d_model: 128
      ssm_size: 64
      n_layers: 3
      dropout: 0.2
      discretization: IMEX
    beta_nll: 0.3
    lambda_spread: 0.5
    base_lr: 1.0e-4
    weight_decay: 1.0e-2
    warmup_epochs: 5
    T_0: 20
    T_mult: 2
    eta_min: 1.0e-6
    warmup_start_factor: 1.0e-2

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.regression_loader.LitBNSDataRegression
  init_args:
    data_cfg:
      target_variables: ['chirp_mass']
      observed_variables: ['snr']
      normalize_variables: true
      normalize_range: [0.0, 1.0]

      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/train/sig_combined_train.h5
      val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/val/sig_combined_val.h5
      test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/ai4gw@cern/bns_snr_5_50_powerlaw_256Hz_80K_10K_100K/test/sig_combined_test.h5

      injected_data_key: whitened_injected

      strain_frequency: 256
      downsample_factor: 1
      strain_duration: 64
      coalescence_time: 63
      window_begin: 59
      window_end: 63

      strain_precision: torch.float32
      variables_precision: torch.float32

      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 256
      num_workers: 4
      shuffle: true
      prefetch_factor: 2
      persistent_workers: true

ckpt_path: null
weights_only: null
