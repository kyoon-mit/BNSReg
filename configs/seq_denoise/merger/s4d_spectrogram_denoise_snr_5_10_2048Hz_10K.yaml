# lightning.pytorch==2.6.0
# S4D denoiser trained on STFT magnitudes (spectral convergence + log
# magnitude) over the 26-30 s merger window.
#
# No test split exists for this dataset, so test_file points at the val file;
# BNSDatasetConfig.__post_init__ requires all three paths to exist.

seed_everything: 20260814

trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 32-true

  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: CLAUDE-TESTS
      name: merger_s4d_spectrogram_denoise_snr_5_10_2048Hz_10K
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 's4d_spectrogram_denoise_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 50
        mode: min
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    # Per-epoch waveform frames + GIF at fit end, logged to wandb.
    - class_path: BNSReg.callbacks.plot_waveform_evolution.WaveformEvolutionCallback
      init_args:
        n_examples: 2
        every_n_epochs: 1
        sample_rate: 2048           # downsample_factor is 1, so no reduction
        window_begin: 26.0          # absolute time axis, matches data_cfg
        plot_window: [26.0, 30.0]   # 4 s leading into the merger
        show_input: true            # noisy input on the time and FFT panels, never the spectrograms
        show_spectrogram: true      # append target/prediction spectrogram columns on the right

        # Spectrogram columns: target vs prediction, so the chirp's frequency
        # sweep is visible in time instead of integrated into one curve.
        spec_nperseg: 256           # samples per STFT chunk: lower = sharper in
                                    # time, higher = sharper in frequency
        spec_overlap: 0.75          # fraction each chunk overlaps the next; higher
                                    # is smoother to look at, slower to draw
        spec_dynamic_range: 60.0    # dB below the target's peak to clip the colour
                                    # scale; both panels share the target's scale
        spec_flim: [20.0, 1024.0]    # frequency axis limits in Hz (log scaled)
        gif_fps: 4

  fast_dev_run: false
  max_epochs: 300
  min_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  enable_progress_bar: true
  enable_model_summary: true
  default_root_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs

# =========================
# Model
# =========================
model:
  class_path: BNSReg.tasks.seq_denoise.s4d_spectrogram.LitModelS4DSpectrogram
  init_args:
    cfg:
      d_input: 2
      d_output: 2
      d_model: 64
      d_state: 64
      n_layers: 4
      dropout: 0.1
      input_norm: false
      lr: 1.0e-3
      dt_min: 0.001
      dt_max: 0.1

    # STFT geometry. The window spans 8192 samples at 2048 Hz, so n_fft 512
    # is 0.25 s per frame at 4 Hz resolution, and hop 128 gives 75 % overlap
    # and 65 frames.
    n_fft: 512
    hop_length: 128
    loss_type: composite   # 'convergence', 'log_magnitude', or 'composite'
    eps: 1.0e-8

    base_lr: 1.0e-3
    weight_decay: 1.0e-2
    scheduler: warmup_cosine
    scheduler_kwargs:
      warmup_epochs: 5
      T_0: 20
      T_mult: 2
      eta_min: 1.0e-7
      warmup_start_factor: 1.0e-2
      peak_decay: 0.8
    monitor: val/loss

# =========================
# Data
# =========================
data:
  class_path: BNSReg.dataloader.seq_encoder_loader.LitBNSDataSeqEncoder
  init_args:
    data_cfg:
      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/checks/bns_snr_5_10_uniform_2048Hz_10K/train/sig_combined_train.h5
      val_file:   /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/checks/bns_snr_5_10_uniform_2048Hz_10K/val/sig_combined_val.h5
      test_file:  /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/checks/bns_snr_5_10_uniform_2048Hz_10K/val/sig_combined_val.h5

      injected_data_key: whitened_injected
      sig_only_data_key: whitened_signal

      strain_frequency: 2048
      downsample_factor: 1
      strain_duration: 32.0
      coalescence_time: 30.0
      window_begin: 26.0
      window_end: 30.0

      strain_precision: torch.float32
      variables_precision: torch.float32

      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75

      train_batch_size: 32
      val_batch_size: 32
      test_batch_size: 32
      num_workers: 8
      shuffle: true
      prefetch_factor: 4
      persistent_workers: true

ckpt_path: null
