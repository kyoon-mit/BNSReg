# lightning.pytorch==2.6.0
seed_everything: 1234
trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: seq_denoise_conv
      id: v0
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/BNSReg/outputs
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_on_train_epoch_end: true
        filename: 's4d_ae_ckpt_{epoch:02d}'
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 50
        mode: min
        verbose: True
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: 'epoch'
  fast_dev_run: false
  max_epochs: 500
  min_epochs: 1
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: true
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  class_path: BNSReg.tasks.seq_denoise.s4d_ae.LitModelS4DAE
  init_args:
    cfg:
      d_input: 1
      d_output: 2048
      d_model: 128
      d_state: 64
      n_layers: 4
      dropout: 0.2
data:
  class_path: BNSReg.dataloader.seq_encoder_loader.LitBNSDataSeqEncoder
  init_args:
    cfg:
      train_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/seq_bns_snr_20_30_uniform_512Hz_10K/train/sig_combined_train.h5
      test_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/seq_bns_snr_20_30_uniform_512Hz_10K/test/sig_combined_test.h5
      val_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/seq_bns_snr_20_30_uniform_512Hz_10K/val/sig_combined_val.h5
      injected_data_key: injected_data
      waveform_data_key: signal_only_data
      strain_frequency: 512
      downsample_factor: 2
      strain_duration: 64.0
      coalescence_time: 63.0
      window_begin: 55.0
      window_end: 63.0
      strain_precision: torch.float32
      variables_precision: torch.float32
      rdcc_nbytes: 67108864
      rdcc_nslots: 10007
      rdcc_w0: 0.75
      train_batch_size: 64
      val_batch_size: 64
      test_batch_size: 64
      num_workers: 4
      shuffle: true
      prefetch_factor: 2
      persistent_workers: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 5e-4
lr_scheduler:
  class_path: torch.optim.lr_scheduler.ExponentialLR
  init_args:
    gamma: 0.9975
ckpt_path: null
weights_only: null